services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yieldlens
      POSTGRES_PASSWORD: yieldlens
      POSTGRES_DB: yieldlens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yieldlens -d yieldlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://yieldlens:yieldlens@postgres:5432/yieldlens
      BACKEND_CORS_ORIGINS: http://localhost:3000
      BOND_PROVIDER: demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres-data:

